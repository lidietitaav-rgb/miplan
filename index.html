<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#6c3fc5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Plan — Entreno y Nutrición</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f7ff; --bg2:#ffffff; --bg3:#f0eeff; --bg4:#e8e4ff;
  --line:#e2daf5; --line2:#d3c7ee;
  --tx:#1a1033; --tx2:#4b3f72; --tx3:#8b80a8;
  --gym:#6c3fc5; --gym2:#4f86f7;
  --nut:#16a34a; --nut2:#15803d;
  --azul:#4f86f7; --rojo:#dc2626; --ok:#16a34a; --am:#d97706;
  --sh:0 2px 12px rgba(108,63,197,.10); --shl:0 4px 24px rgba(108,63,197,.15);
  --r:16px; --r2:10px;
  --fb:'Inter',system-ui,-apple-system,sans-serif;
  --fm:'Space Mono',monospace;
  --head:56px; --nav:68px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--fb);overscroll-behavior:none}
body{overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}

/* ---------- SHELL ---------- */
#head{position:fixed;top:0;left:0;right:0;height:calc(var(--head) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);background:var(--bg2);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding-left:8px;padding-right:8px;z-index:50;box-shadow:var(--sh)}
#head .ttl{flex:1;font-size:14px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--gym);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbtn{width:38px;height:38px;border:none;background:none;font-size:18px;border-radius:10px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.hbtn:active{background:var(--bg3)}
.hbtn.hide{visibility:hidden}

#main{position:fixed;top:calc(var(--head) + env(safe-area-inset-top));bottom:calc(var(--nav) + env(safe-area-inset-bottom));
  left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.view{display:none;padding:14px 14px 34px;max-width:760px;margin:0 auto}
.view.on{display:block;animation:in .18s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:var(--bg2);border-top:1px solid var(--line);
  display:flex;z-index:50;box-shadow:0 -2px 12px rgba(108,63,197,.07)}
#nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.4px;color:var(--tx3);
  cursor:pointer;text-transform:uppercase}
#nav button i{font-style:normal;font-size:20px;line-height:1}
#nav button.on{color:var(--gym)}

/* ---------- BLOQUES ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:15px;
  margin-bottom:12px;box-shadow:var(--sh)}
.card.flat{background:var(--bg3);box-shadow:none}
.card.warn{background:#fff8e8;border-color:#f3dfae;box-shadow:none}
.card.acc{border-left:4px solid var(--gym)}
h2.sec{font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);
  margin:22px 0 10px;font-family:var(--fm)}
h3{font-size:15px;font-weight:800;margin-bottom:6px}
p{font-size:14px;line-height:1.55}
.mini{font-size:12.5px;color:var(--tx2);line-height:1.55}
.tiny{font-size:11px;color:var(--tx3);font-family:var(--fm);letter-spacing:.4px}
a{color:var(--gym)}

.pill{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  padding:4px 9px;border-radius:20px;background:var(--bg3);color:var(--tx2);font-family:var(--fm)}
.pill.g{background:#dcfce7;color:#15803d}
.pill.o{background:#ffedd5;color:#c2410c}
.pill.b{background:#dbeafe;color:#1d4ed8}
.pill.r{background:#fee2e2;color:#b91c1c}

.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}

.btn{border:none;border-radius:var(--r2);padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;
  background:var(--gym);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  box-shadow:0 1px 4px rgba(108,63,197,.18)}
.btn:active{opacity:.85;transform:translateY(1px)}
.btn.g{background:var(--nut);color:#fff}
.btn.sec{background:var(--bg3);color:var(--gym);box-shadow:none}
.btn.gh{background:var(--bg2);border:1px solid var(--line2);color:var(--tx2);box-shadow:none}
.btn.full{width:100%}
.btn.sm{padding:8px 12px;font-size:12px}
.btn.dg{background:var(--bg2);border:1px solid #f4c7c7;color:var(--rojo);box-shadow:none}

input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);
  padding:11px 12px;font-size:15px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gym);box-shadow:0 0 0 3px rgba(108,63,197,.12)}
label.lb{display:block;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--tx3);margin-bottom:5px;font-family:var(--fm)}
.fg{margin-bottom:12px}
.frow{display:flex;gap:10px}.frow>*{flex:1}

.bar{height:7px;background:var(--bg4);border-radius:7px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:7px;background:var(--gym);transition:width .3s}
.bar i.ok{background:var(--ok)}.bar i.over{background:var(--am)}

/* ---------- HOY ---------- */
.hero{background:linear-gradient(140deg,#fff,var(--bg3));border:1px solid var(--line);
  border-radius:var(--r);padding:18px;margin-bottom:12px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.hero:before{content:'';position:absolute;top:0;left:0;width:5px;height:100%;background:var(--accentC,var(--gym))}
.hero .d{font-family:var(--fm);font-size:11px;letter-spacing:1px;color:var(--tx3);text-transform:uppercase}
.hero .t{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:5px 0 8px;line-height:1.15}
.chk{display:flex;align-items:flex-start;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:none}
.chk input{width:20px;height:20px;flex:0 0 20px;margin-top:1px;accent-color:var(--gym)}
.chk span{font-size:14px;line-height:1.4}
.chk.done span{color:var(--tx3);text-decoration:line-through}

.meal{padding:11px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:none}
.meal .l{font-family:var(--fm);font-size:10px;letter-spacing:1px;color:var(--tx3);text-transform:uppercase}
.meal .t{font-size:14.5px;margin-top:3px;line-height:1.45;font-weight:500}
.meal .s{font-size:12.5px;color:var(--tx2);margin-top:4px;line-height:1.45}

/* ---------- RUTINAS ---------- */
.rcard{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  margin-bottom:11px;display:flex;cursor:pointer;box-shadow:var(--sh)}
.rcard .stripe{width:6px;flex:0 0 6px}
.rcard .body{padding:14px;flex:1;min-width:0}
.rcard .nm{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.rcard .ds{font-size:12.5px;color:var(--tx2);margin:5px 0 9px}
.rcard .mt{display:flex;gap:6px;flex-wrap:wrap}

.phase{margin-bottom:14px}
.phhead{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--bg3);
  border-radius:var(--r2);cursor:pointer;margin-bottom:8px}
.phhead .lb2{font-family:var(--fm);font-size:11px;letter-spacing:.8px;font-weight:700;color:var(--tx2)}
.phhead .tg{font-size:11px;color:var(--tx3);transition:transform .2s}
.phhead .tg.cl{transform:rotate(-90deg)}
.exrow{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--bg2);
  border:1px solid var(--line);border-radius:var(--r2);margin-bottom:7px;cursor:pointer}
.exrow.done{border-color:#bbf7d0;background:#f0fdf4}
.thumb{width:44px;height:44px;flex:0 0 44px;border-radius:10px;background:var(--bg3);display:flex;
  align-items:center;justify-content:center;font-size:20px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.exrow .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.exrow .mt{font-family:var(--fm);font-size:10.5px;color:var(--tx3);margin-top:3px;letter-spacing:.3px}
.badge{font-family:var(--fm);font-size:11px;font-weight:700;padding:5px 8px;border-radius:8px;
  background:var(--bg4);color:var(--gym);white-space:nowrap}
.badge.none{background:var(--bg3);color:var(--tx3)}
.chev{color:var(--tx3);font-size:16px}

.exhero{border-radius:var(--r);overflow:hidden;background:var(--bg2);border:1px solid var(--line);
  margin-bottom:12px;box-shadow:var(--sh)}
.exhero .media{width:100%;height:190px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:60px}
.exhero .media img{width:100%;height:100%;object-fit:contain;background:#fff}
.exhero .info{padding:15px}

.logrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:none}
.logrow .dt{font-family:var(--fm);font-size:11px;color:var(--tx3);width:76px;flex:0 0 76px}
.logrow .vl{font-size:17px;font-weight:800;color:var(--gym);font-family:var(--fm)}
.logrow .nt{font-size:12px;color:var(--tx2);font-style:italic;flex:1;min-width:0}

/* ---------- SUBTABS ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.subtabs button{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:8px 14px;
  font-size:12.5px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap}
.subtabs button.on{background:var(--gym);color:#fff;border-color:var(--gym)}
.days{display:flex;gap:5px;margin-bottom:14px;overflow-x:auto}
.days button{flex:1;min-width:44px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;
  padding:9px 4px;font-size:11.5px;font-weight:700;color:var(--tx2);cursor:pointer;font-family:var(--fm)}
.days button.on{background:var(--gym);color:#fff;border-color:var(--gym)}
.days button.tr{border-color:var(--gym2);border-width:2px}
.days button.on.tr{border-color:var(--gym)}

/* ---------- CONTADORES ---------- */
.cnt{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.cnt:last-child{border-bottom:none}
.cnt .nm{font-size:14px;font-weight:700}
.cnt .ds{font-size:11.5px;color:var(--tx3);line-height:1.4;margin-top:2px}
.step{display:flex;align-items:center;gap:7px}
.step button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);
  font-size:17px;color:var(--gym);cursor:pointer;font-weight:700}
.step button:active{background:var(--bg3)}
.step .v{min-width:48px;text-align:center;font-family:var(--fm);font-size:12.5px;font-weight:700}

/* ---------- KPI / PROGRESO ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.kpi{background:var(--bg3);border:1px solid var(--line);border-radius:var(--r2);padding:14px 8px;text-align:center}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1;font-family:var(--fm);color:var(--gym)}
.kpi .l{font-size:10px;color:var(--tx3);margin-top:6px;line-height:1.3}
.spark{width:100%;height:80px;display:block}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--fm);font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--tx3);
  text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}

/* ---------- PLANIFICADOR ---------- */
.plan-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.plan-row:last-child{border-bottom:none}
.plan-row .dd{font-family:var(--fm);font-size:11px;color:var(--tx3);width:34px;flex:0 0 34px;text-transform:uppercase}
.plan-row select{padding:9px 10px;font-size:13px}

/* ---------- SESIÓN EN VIVO ---------- */
.sbar{position:sticky;top:-1px;z-index:20;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shl)}
.sbar .tm{font-family:var(--fm);font-size:24px;font-weight:700;letter-spacing:-1px;min-width:74px;color:var(--gym)}
.sbar .pr{flex:1;min-width:0}
.sbar .pr .l{font-size:11px;color:var(--tx3);font-family:var(--fm);letter-spacing:.5px}
.sex{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:12px;
  margin-bottom:9px;box-shadow:var(--sh)}
.sex.full{border-color:#bbf7d0;background:#f6fef8}
.sex .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sex .nm{font-size:14px;font-weight:700;line-height:1.25}
.sex .mt{font-family:var(--fm);font-size:10.5px;color:var(--tx3);margin-top:2px}
.serie{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;background:var(--bg3);
  margin-bottom:6px;cursor:pointer;border:1px solid transparent}
.serie:last-child{margin-bottom:0}
.serie.ok{background:#f0fdf4;border-color:#bbf7d0}
.serie .n{width:24px;height:24px;flex:0 0 24px;border-radius:7px;background:var(--bg4);display:flex;
  align-items:center;justify-content:center;font-family:var(--fm);font-size:11px;font-weight:700;color:var(--tx2)}
.serie.ok .n{background:var(--ok);color:#fff}
.serie .vv{flex:1;font-size:13px;color:var(--tx2)}
.serie.ok .vv{color:var(--tx);font-weight:600}
.serie .prev{font-family:var(--fm);font-size:10.5px;color:var(--tx3)}
#rest{position:fixed;left:14px;right:14px;bottom:calc(var(--nav) + 14px + env(safe-area-inset-bottom));
  background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:12px 16px;z-index:120;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shl);max-width:520px;margin:0 auto}
#rest.hide{display:none}
#rest .c{font-family:var(--fm);font-size:22px;font-weight:700;min-width:52px;color:var(--gym)}
#rest .b{flex:1;height:7px;background:var(--bg4);border-radius:7px;overflow:hidden}
#rest .b i{display:block;height:100%;background:var(--gym);border-radius:7px;transition:width 1s linear}

/* ---------- EDITOR ---------- */
.edrow{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg2);border:1px solid var(--line);
  border-radius:var(--r2);margin-bottom:7px}
.edrow .nm{font-size:13.5px;font-weight:600;line-height:1.3}
.edrow .mt{font-family:var(--fm);font-size:10px;color:var(--tx3);margin-top:2px}
.colors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.colors button{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer;
  box-shadow:0 1px 4px rgba(26,16,51,.12)}
.colors button.on{border-color:var(--tx);transform:scale(1.08)}
.imgprev{width:100%;height:150px;border-radius:var(--r2);background:var(--bg3);display:flex;align-items:center;
  justify-content:center;font-size:38px;overflow:hidden;margin-bottom:10px}
.imgprev img{width:100%;height:100%;object-fit:contain;background:#fff}

/* ---------- BARRAS ---------- */
.chart{display:flex;align-items:flex-end;gap:4px;height:96px;margin:14px 0 4px}
.chart .cb{flex:1;background:var(--bg4);border-radius:5px 5px 0 0;position:relative;min-height:3px}
.chart .cb.hot{background:var(--gym)}
.chart .cb span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-family:var(--fm);
  font-size:9px;color:var(--tx2);font-weight:700}
.chlabels{display:flex;gap:4px}
.chlabels div{flex:1;text-align:center;font-family:var(--fm);font-size:8.5px;color:var(--tx3)}

/* ---------- MODAL ---------- */
.modal{position:fixed;inset:0;background:rgba(26,16,51,.42);z-index:200;display:flex;align-items:flex-end;
  justify-content:center;backdrop-filter:blur(3px)}
.modal.hide{display:none}
.msheet{background:var(--bg2);border-radius:22px 22px 0 0;width:100%;
  max-width:520px;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;
  animation:up .22s ease;box-shadow:0 -8px 40px rgba(26,16,51,.25)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.mtitle{font-size:18px;font-weight:800;margin-bottom:4px}
.msub{font-size:12.5px;color:var(--tx2);margin-bottom:16px}
.mbtns{display:flex;gap:10px;margin-top:16px}.mbtns>*{flex:1}

.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:9px;padding:10px 4px;
  font-size:12px;font-weight:700;color:var(--tx2);cursor:pointer}
.seg button.on{background:var(--gym);border-color:var(--gym);color:#fff}

.empty{text-align:center;padding:34px 16px;color:var(--tx3)}
.empty .ic{font-size:40px;margin-bottom:10px;opacity:.6}
.empty p{font-size:13.5px;line-height:1.6}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 24px);background:var(--tx);
  color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:600;z-index:300;
  box-shadow:0 8px 28px rgba(26,16,51,.3);white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

details{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;
  margin-bottom:8px;box-shadow:var(--sh)}
details summary{cursor:pointer;font-size:14px;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:'+ ';color:var(--gym);font-weight:800}
details[open] summary:before{content:'– '}
details .bd{font-size:13.5px;color:var(--tx2);line-height:1.6;margin-top:10px}
ul.li{margin:8px 0 0 18px}ul.li li{font-size:13.5px;line-height:1.6;margin:5px 0;color:var(--tx2)}
</style>
</head>
<body>
<div id="head">
  <button class="hbtn hide" id="btnBack" onclick="goBack()">←</button>
  <div class="ttl" id="hTitle">Mi Plan</div>
  <button class="hbtn" onclick="openView('guia')">☰</button>
</div>

<div id="main">
  <div class="view on" id="v-hoy"></div>
  <div class="view" id="v-entreno"></div>
  <div class="view" id="v-rutina"></div>
  <div class="view" id="v-ejercicio"></div>
  <div class="view" id="v-sesion"></div>
  <div class="view" id="v-editar"></div>
  <div class="view" id="v-nutri"></div>
  <div class="view" id="v-progreso"></div>
  <div class="view" id="v-guia"></div>
</div>

<div id="nav">
  <button data-v="hoy"      onclick="openView('hoy')"><i>◉</i>Hoy</button>
  <button data-v="entreno"  onclick="openView('entreno')"><i>🏋</i>Entreno</button>
  <button data-v="nutri"    onclick="openView('nutri')"><i>🥗</i>Nutrición</button>
  <button data-v="progreso" onclick="openView('progreso')"><i>📈</i>Progreso</button>
</div>

<!-- MODAL genérico -->
<div class="modal hide" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="msheet" id="msheet"></div>
</div>

<div id="rest" class="hide">
  <div class="c" id="restC">60</div>
  <div class="b"><i id="restB" style="width:100%"></i></div>

  {n:'Activación de glúteo con goma', r:'15 reps', d:'Goma en las rodillas, en semisentadilla, abre y cierra rodillas contra la resistencia.', e:'🍑'}
];
const ESTIRA = {n:'Estiramiento y respiración', r:'5-8 minutos',
  d:'Estira cuádriceps, isquios, glúteo, pectoral y hombro. Mantén cada postura 20-30 segundos respirando lento.', e:'🧘'};

function mkEx(rid, i, phase, o){
  return { id:'e_'+rid+'_'+i, phase, name:o.n, sets:o.s||1, reps:o.r, desc:o.d||'', emoji:o.e||'🏋️', img:'', type:o.t||'weight' };
}
function mkRoutine(id, name, desc, color, objective, impact, mains, absList){
  const ex = [];
  let i = 1;
  CAL.forEach(c => ex.push(mkEx(id, i++, 'warmup', {...c, t:'reps'})));
  mains.forEach(m => ex.push(mkEx(id, i++, 'main', m)));
  (absList||[]).forEach(a => ex.push(mkEx(id, i++, 'abs', {...a, t:'time'})));
  ex.push(mkEx(id, i++, 'cooldown', {...ESTIRA, t:'time'}));
  return { id, name, desc, color, objective, impact, program:'casa', exercises:ex };
}

/* ===================== ALMACENAMIENTO ===================== */
const KEY = 'miplan_v2';
let SAFE = false;
try{ const t='__t'; localStorage.setItem(t,'1'); localStorage.removeItem(t); SAFE = true; }catch(e){ SAFE = false; }

function nuevoDB(){
  return { v:3, routines:[], weights:{}, sessions:[], schedule:['h1','h2','h5','h3','h4',null,null],
           nutri:{ semanas:{}, medidas:[] }, done:{}, activeSession:null, imgs:{} };
}
let DB = nuevoDB();
let migrado = [];

function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

function cargar(){
  let raw = SAFE ? ls(KEY) : null;
  if(raw){
    try{ DB = Object.assign(nuevoDB(), JSON.parse(raw)); }catch(e){ DB = nuevoDB(); }
  }
  /* ---- Rutinas: las de casa siempre presentes; las del gimnasio se conservan ---- */
  if(!DB.routines || !DB.routines.length){
    let gym = null;
    const gr = ls('gymtrack_routines');
    if(gr){ try{ gym = JSON.parse(gr); }catch(e){} }
    if(gym && gym.length){ gym.forEach(r => r.program = r.program || 'gym'); migrado.push(gym.length+' rutinas de GymTrack'); }
    else { gym = JSON.parse(JSON.stringify(GYM_ROUTINES)); gym.forEach(r => r.program='gym'); }
    DB.routines = HOME_ROUTINES.concat(gym);
  } else {
    /* asegura que las rutinas de casa existen aunque vengan de una versión previa */
    HOME_ROUTINES.forEach(h => { if(!DB.routines.some(r => r.id === h.id)) DB.routines.push(h); });
  }
  /* ---- Registros de peso de GymTrack ---- */
  if(!DB.weights || !Object.keys(DB.weights).length){
    const gw = ls('gymtrack_weights');
    if(gw){ try{ const w = JSON.parse(gw); if(w && Object.keys(w).length){ DB.weights = w;
      migrado.push(Object.keys(w).length+' ejercicios con historial de peso'); } }catch(e){} }
  }
  /* ---- Sesiones de GymTrack ---- */
  if(!DB.sessions || !DB.sessions.length){
    const gs = ls('gymtrack_sessions');
    if(gs){ try{ const s = JSON.parse(gs); if(s && s.length){ DB.sessions = s; migrado.push(s.length+' sesiones'); } }catch(e){} }
  }
  /* ---- Nutrición de la app anterior ---- */
  if(!DB.nutri || !Object.keys(DB.nutri.semanas||{}).length){
    const pn = ls('planNutricionEntreno.v1');
    if(pn){ try{ const n = JSON.parse(pn);
      if(n && n.semanas){ DB.nutri = { semanas:n.semanas||{}, medidas:n.medidas||[] };
        migrado.push('tu seguimiento de nutrición'); } }catch(e){} }
  }
  /* ---- Deduce el tipo de registro en ejercicios que no lo traen (los del gimnasio) ---- */
  DB.routines.forEach(r => r.exercises.forEach(e => {
    if(e.type) return;
    const t = String(e.reps || '');
    if(/segundo|minuto|\d\s*["']|\bs\b|\bmin\b/i.test(t)) e.type = 'time';
    else if(e.phase === 'warmup' || e.phase === 'abs' || e.phase === 'cooldown') e.type = 'reps';
    else e.type = 'weight';
  }));
  /* ---- Normaliza las sesiones heredadas de GymTrack ----
     La app antigua guardaba la duración en MILISEGUNDOS y el nombre en routineName.
     Esta corrección es idempotente: una vez convertida, ya no se vuelve a tocar. */
  DB.sessions = (DB.sessions || []).map(s => {
    const o = Object.assign({}, s);
    if(!o.name) o.name = o.routineName || (rutina(o.routineId) || {}).name || 'Sesión';
    if(typeof o.duration === 'number'){
      if(o.duration > 300) o.duration = Math.max(1, Math.round(o.duration/60000));  // venía en ms
      else o.duration = Math.round(o.duration);
    }
    if(o.series == null && typeof o.done === 'number') o.series = o.done;
    if(o.seriesTotal == null && typeof o.total === 'number') o.seriesTotal = o.total;
    delete o.routineName; delete o.done; delete o.skipped; delete o.total;
    return o;
  });

  if(!DB.nutri) DB.nutri = { semanas:{}, medidas:[] };
  if(!DB.nutri.medidas) DB.nutri.medidas = [];
  if(!DB.done) DB.done = {};
  if(!DB.imgs) DB.imgs = {};
  guardar();
}
function guardar(){
  if(!SAFE) return true;
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
  catch(e){
    if(String(e).match(/quota|Quota|exceeded/)){
      alert('El navegador se ha quedado sin espacio. Descarga una copia desde Progreso y borra alguna imagen propia que hayas subido: son lo que más ocupa.');
    }
    return false;
  }
}

/* ===================== UTILIDADES ===================== */
const hoy = () => new Date();
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function idxHoy(){ return (hoy().getDay()+6)%7; }
function semKey(f){
  const t = new Date(Date.UTC(f.getFullYear(), f.getMonth(), f.getDate()));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay()+6)%7) + 3);
  const j = new Date(Date.UTC(t.getUTCFullYear(),0,4));
  j.setUTCDate(j.getUTCDate() - ((j.getUTCDay()+6)%7) + 3);
  return t.getUTCFullYear()+'-S'+String(1+Math.round((t-j)/(7*864e5))).padStart(2,'0');
}
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function rangoSem(k){
  const [a,s] = k.split('-S');
  const j = new Date(Date.UTC(+a,0,4)); j.setUTCDate(j.getUTCDate()-((j.getUTCDay()+6)%7));
  const l = new Date(j.getTime()+(+s-1)*7*864e5), d = new Date(l.getTime()+6*864e5);
  const f = x => x.getUTCDate()+' '+MESES[x.getUTCMonth()];
  return f(l)+' – '+f(d);
}
function fFecha(s){ const d = new Date(s);
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getFullYear()).slice(2); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const SEM = semKey(hoy());

function semana(k){
  if(!DB.nutri.semanas[k]){ const r={}; CONTADORES.forEach(c=>r[c.k]=0); DB.nutri.semanas[k] = {chk:{}, rac:r}; }
  const s = DB.nutri.semanas[k];
  if(!s.chk) s.chk = {};
  if(!s.rac) s.rac = {};
  CONTADORES.forEach(c=>{ if(typeof s.rac[c.k] !== 'number') s.rac[c.k] = 0; });
  return s;
}
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(t._x); t._x = setTimeout(()=>t.classList.remove('on'), 2200); }

/* ===================== PLANIFICACIÓN E HIDRATOS ===================== */
function rutina(id){ return DB.routines.find(r => r.id === id) || null; }
function esEntreno(id){ const r = rutina(id); return !!r && r.id !== 'h5'; }
function diasEntreno(){ return DB.schedule.filter(esEntreno).length; }
function cuartos(){ const d = diasEntreno(); return d <= 3 ? 4 : (d === 4 ? 5 : 6); }
function tieneHc(i){ const m = MENU[i]; return m.hcPrio !== null && m.hcPrio > 0 && m.hcPrio <= cuartos(); }
function textoReparto(){
  const d = diasEntreno(), c = cuartos();
  const base = d <= 3 ? '1 plato completo repartido en 4 guarniciones de ¼'
             : d === 4 ? '1 plato completo + ¼, o sea 5 guarniciones'
             : '1 plato completo + ⅓, o sea unas 6 guarniciones';
  return d+' día'+(d===1?'':'s')+' de entreno planificados → '+base+', más 1 patata pequeña el día de legumbre.';
}

function marcaHecho(id){
  const k = iso(hoy())+'|'+id;
  if(DB.done[k]) delete DB.done[k]; else DB.done[k] = true;
  guardar(); pintaEjercicio(id); toast(DB.done[k] ? 'Marcado' : 'Desmarcado');
}

/* ----- registro de carga ----- */
let regEdit = null;
function abrirReg(exId, idx){
  const f = buscaEj(exId); if(!f) return;
  const e = f.e, tipo = e.type || 'weight';
  const prev = (idx!=null) ? DB.weights[exId][idx] : null;
  regEdit = { exId, idx: (idx==null ? null : idx), tipo };
  const campos = tipo === 'time'
    ? `<div class="fg"><label class="lb">Tiempo</label><input id="rTime" placeholder="45 s · 2 min" value="${prev?esc(prev.time||''):''}"></div>`
    : tipo === 'reps'
    ? `<div class="fg"><label class="lb">Repeticiones</label><input id="rReps" type="number" inputmode="numeric" value="${prev&&prev.reps!=null?prev.reps:''}"></div>`
    : `<div class="frow"><div class="fg"><label class="lb">Peso (kg)</label>
         <input id="rKg" type="number" step="0.5" inputmode="decimal" value="${prev&&prev.kg!=null?prev.kg:''}"></div>
       <div class="fg"><label class="lb">Reps</label>
         <input id="rReps" type="number" inputmode="numeric" value="${prev&&prev.reps!=null?prev.reps:''}"></div></div>`;
  modal(`<div class="mtitle">${idx==null?'Registrar':'Editar registro'}</div>
    <div class="msub">${esc(e.name)}</div>
    <div class="fg"><label class="lb">Fecha</label><input id="rFecha" type="date" value="${prev?(prev.d||iso(new Date(prev.date))):iso(hoy())}"></div>
    ${campos}
    <div class="fg"><label class="lb">Notas (opcional)</label><input id="rNotas" placeholder="goma dura, me sobró una serie…" value="${prev?esc(prev.notes||''):''}"></div>
    <div class="mbtns"><button class="btn sec" onclick="closeModal()">Cancelar</button>
    <button class="btn g" onclick="guardarReg()">Guardar</button></div>`);
}
function editReg(exId, idx){ abrirReg(exId, idx); }
function guardarReg(){
  const {exId, idx, tipo} = regEdit;
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const reg = { d: g('rFecha') || iso(hoy()), notes: g('rNotas') };
  if(tipo === 'time'){ if(!g('rTime')){ alert('Pon el tiempo que has aguantado.'); return; } reg.time = g('rTime'); }
  else if(tipo === 'reps'){ const r = parseInt(g('rReps')); if(isNaN(r)){ alert('Pon las repeticiones.'); return; } reg.reps = r; }
  else { const k = parseFloat(g('rKg')), r = parseInt(g('rReps'));
    if(isNaN(k) && isNaN(r)){ alert('Pon al menos el peso o las repeticiones.'); return; }
    if(!isNaN(k)) reg.kg = k; if(!isNaN(r)) reg.reps = r; }
  if(!DB.weights[exId]) DB.weights[exId] = [];
  if(idx == null) DB.weights[exId].push(reg); else DB.weights[exId][idx] = reg;
  DB.weights[exId].sort((a,b) => (a.d||a.date) < (b.d||b.date) ? -1 : 1);
  guardar(); closeModal(); pintaEjercicio(exId); toast('Registro guardado');
}
function delReg(exId, idx){
  if(!confirm('¿Borrar este registro?')) return;
  DB.weights[exId].splice(idx,1); guardar(); pintaEjercicio(exId); toast('Registro borrado');
}

/* ===================== SESIÓN EN VIVO, SERIE A SERIE ===================== */
let crono = null, descanso = null;
let DESCANSO_SEG = 60;

function iniSesion(rid){
  const r = rutina(rid); if(!r) return;
  if(DB.activeSession && DB.activeSession.routineId !== rid){
    if(!confirm('Tienes una sesión de "'+DB.activeSession.name+'" sin cerrar. ¿La descartas y empiezas esta?')) return;
  }
  const series = {};
  r.exercises.forEach(e => {
    series[e.id] = Array.from({length: Math.max(1, e.sets||1)}, () => ({ done:false }));
  });
  DB.activeSession = { routineId:rid, name:r.name, start:Date.now(), series };
  guardar(); openView('sesion'); toast('Sesión iniciada · vamos');
}

function arrancaCrono(){
  pararCrono();
  crono = setInterval(() => {
    const el = document.getElementById('cronoTxt');
    if(!el || !DB.activeSession){ pararCrono(); return; }
    el.textContent = fmtDur(Date.now() - DB.activeSession.start);
  }, 1000);
}
function pararCrono(){ if(crono){ clearInterval(crono); crono = null; } }
function fmtDur(ms){
  const s = Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

function totalSeries(){
  const s = DB.activeSession; if(!s) return {hechas:0, total:0};
  let h=0, t=0;
  Object.values(s.series).forEach(arr => arr.forEach(x => { t++; if(x.done) h++; }));
  return {hechas:h, total:t};
}

function pintaSesion(){
  const s = DB.activeSession;
  if(!s){ document.getElementById('v-sesion').innerHTML =
    '<div class="empty"><div class="ic">🏋️</div><p>No hay ninguna sesión en curso.</p></div>'; return; }
  const r = rutina(s.routineId); if(!r) return;
  const {hechas,total} = totalSeries();
  const pct = total ? Math.round(hechas/total*100) : 0;

  const bloques = FASES.map(f => {
    const ex = r.exercises.filter(e => e.phase === f.k);
    if(!ex.length) return '';
    return `<h2 class="sec">${f.l}</h2>` + ex.map(e => {
      const arr = s.series[e.id] || [];
      const listo = arr.length && arr.every(x => x.done);
      const prev = (DB.weights[e.id]||[]).slice(-1)[0];
      const prevTxt = prev ? (prev.kg!=null ? prev.kg+' kg' : (prev.time || (prev.reps!=null ? prev.reps+' rep' : ''))) : '';
      return `<div class="sex ${listo?'full':''}">
        <div class="hd">
          <div class="thumb">${imgOf(e)?`<img src="${imgOf(e)}" onerror="this.parentElement.textContent='${e.emoji||'🏋️'}'">`:(e.emoji||'🏋️')}</div>
          <div class="grow"><div class="nm">${esc(e.name)}</div>
            <div class="mt">${e.sets} × ${esc(e.reps)}${prevTxt?' · última vez '+esc(prevTxt):''}</div></div>
          <button class="btn gh sm" onclick="abrirEjercicio('${e.id}')">?</button>
        </div>
        ${arr.map((x,i) => `<div class="serie ${x.done?'ok':''}" onclick="tocaSerie('${e.id}',${i})">
            <div class="n">${x.done?'✓':(i+1)}</div>
            <div class="vv">${x.done ? esc(valSerie(x)) : 'Serie '+(i+1)+' — toca al terminarla'}</div>
            ${!x.done && prevTxt ? `<div class="prev">${esc(prevTxt)}</div>` : ''}
          </div>`).join('')}
      </div>`;
    }).join('');
  }).join('');

  document.getElementById('v-sesion').innerHTML = `
    <div class="sbar">
      <div class="tm" id="cronoTxt">${fmtDur(Date.now()-s.start)}</div>
      <div class="pr">
        <div class="l">${hechas} DE ${total} SERIES · ${pct}%</div>
        <div class="bar"><i class="${pct>=100?'ok':''}" style="width:${pct}%"></i></div>
      </div>
    </div>
    <div class="hero" style="--accentC:${r.color};padding:14px">
      <div class="d">Sesión en curso</div>
      <div class="t" style="font-size:17px;color:${r.color}">${esc(r.name)}</div>
    </div>
    ${bloques}
    <div style="height:6px"></div>
    <button class="btn full" style="background:${r.color}" onclick="finSesion()">■ Finalizar y guardar</button>
    <button class="btn gh full sm" style="margin-top:9px" onclick="cancelSesion()">Descartar sesión</button>
    <div class="card flat" style="margin-top:14px">
      <div class="row between"><div class="mini">Descanso automático entre series</div>
        <select style="width:120px" onchange="DESCANSO_SEG=+this.value">
          ${[0,45,60,90,120].map(v=>`<option value="${v}" ${v===DESCANSO_SEG?'selected':''}>${v?v+' s':'sin aviso'}</option>`).join('')}
        </select></div>
    </div>`;
  arrancaCrono();
}

function valSerie(x){
  if(x.time) return x.time;
  if(x.kg != null && x.reps != null) return x.kg+' kg × '+x.reps;
  if(x.kg != null) return x.kg+' kg';
  if(x.reps != null) return x.reps+' reps';
  return 'hecha';
}

function tocaSerie(exId, i){
  const s = DB.activeSession; if(!s) return;
  const x = s.series[exId][i];
  if(x.done){ // deshacer
    s.series[exId][i] = { done:false };
    guardar(); pintaSesion(); return;
  }
  const f = buscaEj(exId); if(!f) return;
  const e = f.e, tipo = e.type || 'weight';
  /* precarga: la serie anterior de hoy, o el último registro guardado */
  const ant = s.series[exId].slice(0,i).reverse().find(y => y.done) || (DB.weights[exId]||[]).slice(-1)[0] || {};
  const campos = tipo === 'time'
    ? `<div class="fg"><label class="lb">Tiempo aguantado</label><input id="sTime" value="${esc(ant.time||e.reps||'')}"></div>`
    : tipo === 'reps'
    ? `<div class="fg"><label class="lb">Repeticiones</label><input id="sReps" type="number" inputmode="numeric" value="${ant.reps!=null?ant.reps:''}"></div>`
    : `<div class="frow"><div class="fg"><label class="lb">Peso (kg)</label>
         <input id="sKg" type="number" step="0.5" inputmode="decimal" value="${ant.kg!=null?ant.kg:''}"></div>
       <div class="fg"><label class="lb">Reps</label>
         <input id="sReps" type="number" inputmode="numeric" value="${ant.reps!=null?ant.reps:''}"></div></div>`;
  modal(`<div class="mtitle">Serie ${i+1} de ${s.series[exId].length}</div>
    <div class="msub">${esc(e.name)}</div>
    ${campos}
    <div class="mbtns">
      <button class="btn sec" onclick="cierraSerie('${exId}',${i},true)">Solo marcar hecha</button>
      <button class="btn g" onclick="cierraSerie('${exId}',${i},false)">Guardar</button>
    </div>`);
  setTimeout(()=>{ const el = document.querySelector('#msheet input'); if(el) el.focus(); }, 120);
}

function cierraSerie(exId, i, soloMarcar){
  const s = DB.activeSession; if(!s) return;
  const f = buscaEj(exId), tipo = (f.e.type || 'weight');
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const x = { done:true };
  if(!soloMarcar){
    if(tipo === 'time' && g('sTime')) x.time = g('sTime');
    if(tipo !== 'time'){
      const kg = parseFloat(g('sKg')), rp = parseInt(g('sReps'));
      if(!isNaN(kg)) x.kg = kg;
      if(!isNaN(rp)) x.reps = rp;
    }
  }
  s.series[exId][i] = x;
  guardar(); closeModal(); pintaSesion();
  const quedan = s.series[exId].some(y => !y.done);
  if(DESCANSO_SEG > 0 && quedan) empiezaDescanso(DESCANSO_SEG);
}

/* ----- temporizador de descanso ----- */
function empiezaDescanso(seg){
  pararDescanso();
  const box = document.getElementById('rest'), c = document.getElementById('restC'), b = document.getElementById('restB');
  box.classList.remove('hide');
  let left = seg;
  c.textContent = left; b.style.width = '100%';
  descanso = setInterval(() => {
    left--;
    c.textContent = left;
    b.style.width = (left/seg*100)+'%';
    if(left <= 0){ pararDescanso(); toast('¡Siguiente serie!'); if(navigator.vibrate) navigator.vibrate(200); }
  }, 1000);
}
function pararDescanso(){
  if(descanso){ clearInterval(descanso); descanso = null; }
  const box = document.getElementById('rest'); if(box) box.classList.add('hide');
}

/* ----- cierre de sesión ----- */
function finSesion(){
  const s = DB.activeSession; if(!s) return;
  const {hechas,total} = totalSeries();
  if(!hechas){ if(!confirm('No has marcado ninguna serie. ¿Guardar igualmente?')) return; }
  const min = Math.max(1, Math.round((Date.now()-s.start)/60000));

  /* la mejor serie de cada ejercicio pasa al historial de cargas */
  let guardados = 0;
  Object.keys(s.series).forEach(exId => {
    const hechasEx = s.series[exId].filter(x => x.done && (x.kg!=null || x.reps!=null || x.time));
    if(!hechasEx.length) return;
    let best = hechasEx[0];
    hechasEx.forEach(x => { if(x.kg != null && (best.kg == null || x.kg > best.kg)) best = x; });
    if(!DB.weights[exId]) DB.weights[exId] = [];
    const reg = { d: iso(hoy()), notes: 'sesión · '+hechasEx.length+' series' };
    if(best.kg != null) reg.kg = best.kg;
    if(best.reps != null) reg.reps = best.reps;
    if(best.time) reg.time = best.time;
    DB.weights[exId].push(reg);
    DB.weights[exId].sort((a,b) => (a.d||a.date) < (b.d||b.date) ? -1 : 1);
    guardados++;
  });

  DB.sessions.push({ routineId:s.routineId, name:s.name, date:new Date().toISOString(),
                     duration:min, series:hechas, seriesTotal:total });
  DB.activeSession = null;
  semana(SEM).chk['c_'+idxHoy()+'_ent'] = true;
  pararDescanso(); pararCrono(); guardar();
  toast(min+' min · '+hechas+' series · '+guardados+' marcas guardadas');
  openView('progreso');
}
function cancelSesion(){
  if(!confirm('¿Descartar la sesión? No se guardará nada de lo marcado.')) return;
  DB.activeSession = null; pararDescanso(); pararCrono(); guardar();
  toast('Sesión descartada'); openView('entreno');
}

/* ===================== EDITOR DE RUTINAS Y EJERCICIOS ===================== */
const PALETA = ['#6c3fc5','#4f86f7','#16a34a','#db2777','#f59e0b','#0891b2','#dc2626','#8b80a8'];
let colorSel = PALETA[0];
function pickColor(btn, c){

}

function crearRutina(){
  const n = document.getElementById('nrN').value.trim();
  if(!n){ alert('Ponle un nombre a la rutina.'); return; }
  const r = { id:'r_'+Date.now(), name:n.toUpperCase(),
    desc: document.getElementById('nrD').value.trim() || 'Rutina personalizada',
    color: colorSel, objective:'', impact:'',
    program: document.getElementById('nrP').value, exercises:[] };
  DB.routines.push(r); guardar(); closeModal();
  actual.rutina = r.id; pintaEditor(r.id); openView('editar');
  toast('Rutina creada · añádele ejercicios');
}

function abrirEditor(rid){ actual.rutina = rid; pintaEditor(rid); openView('editar'); }

function pintaEditor(rid){
  const r = rutina(rid); if(!r) return;
  const bloques = FASES.map(f => {
    const ex = r.exercises.filter(e => e.phase === f.k);
    return `<h2 class="sec">${f.l}</h2>
      ${ex.map(e => {
        const i = r.exercises.indexOf(e);
        return `<div class="edrow">
          <div class="thumb">${imgOf(e)?`<img src="${imgOf(e)}" onerror="this.parentElement.textContent='${e.emoji||'🏋️'}'">`:(e.emoji||'🏋️')}</div>
          <div class="grow"><div class="nm">${esc(e.name)}</div>
            <div class="mt">${e.sets} × ${esc(e.reps)} · ${(e.type||'weight')==='weight'?'PESO+REPS':(e.type==='time'?'TIEMPO':'REPS')}</div></div>
          <button class="btn gh sm" onclick="mueveEj('${rid}',${i},-1)">↑</button>
          <button class="btn gh sm" onclick="mueveEj('${rid}',${i},1)">↓</button>
          <button class="btn gh sm" onclick="editaEj('${rid}',${i})">✎</button>
          <button class="btn gh sm" onclick="borraEj('${rid}',${i})">✕</button>
        </div>`;
      }).join('')}
      <button class="btn sec full sm" style="margin-bottom:4px" onclick="nuevoEj('${rid}','${f.k}')">+ Añadir aquí</button>`;
  }).join('');

  document.getElementById('v-editar').innerHTML = `
    <div class="card">
      <div class="fg"><label class="lb">Nombre</label><input id="edN" value="${esc(r.name)}"></div>
      <div class="fg"><label class="lb">Descripción</label><input id="edD" value="${esc(r.desc)}"></div>
      <div class="fg"><label class="lb">Objetivo (opcional)</label><input id="edO" value="${esc(r.objective||'')}"></div>
      <div class="fg"><label class="lb">Nota de intensidad (opcional)</label><input id="edI" value="${esc(r.impact||'')}"></div>
      <div class="fg"><label class="lb">Dónde se hace</label><select id="edP">
        <option value="casa" ${r.program==='casa'?'selected':''}>En casa</option>
        <option value="gym" ${r.program!=='casa'?'selected':''}>Gimnasio</option></select></div>
      <label class="lb">Color</label>
      <div class="colors">${PALETA.map(c=>`<button style="background:${c}" class="${c===r.color?'on':''}" onclick="pickColor(this,'${c}')"></button>`).join('')}</div>
      <button class="btn g full" onclick="guardaRutina('${rid}')">Guardar cambios</button>
    </div>
    ${bloques}
    <div style="height:14px"></div>
    <button class="btn dg full" onclick="borraRutina('${rid}')">Eliminar esta rutina</button>`;
  colorSel = r.color;
  document.getElementById('hTitle').textContent = 'Editar';
}

function guardaRutina(rid){
  const r = rutina(rid); if(!r) return;
  r.name = document.getElementById('edN').value.trim() || r.name;
  r.desc = document.getElementById('edD').value.trim() || r.desc;
  r.objective = document.getElementById('edO').value.trim();
  r.impact = document.getElementById('edI').value.trim();
  r.program = document.getElementById('edP').value;
  r.color = colorSel;
  guardar(); pintaEditor(rid); toast('Rutina guardada');
}
function borraRutina(rid){
  const r = rutina(rid); if(!r) return;
  if(!confirm('¿Eliminar "'+r.name+'"? Se borra la rutina, no tu historial de pesos.')) return;
  r.exercises.forEach(e => { delete DB.imgs[e.id]; });
  DB.routines = DB.routines.filter(x => x.id !== rid);
  DB.schedule = DB.schedule.map(x => x === rid ? null : x);
  guardar(); openView('entreno'); toast('Rutina eliminada');
}
function mueveEj(rid, i, dir){
  const r = rutina(rid), ex = r.exercises;
  const e = ex[i], fase = e.phase;
  const mismos = ex.map((x,j)=>({x,j})).filter(o => o.x.phase === fase);
  const pos = mismos.findIndex(o => o.j === i);
  const destino = mismos[pos+dir];
  if(!destino) return;
  ex[i] = destino.x; ex[destino.j] = e;
  guardar(); pintaEditor(rid);
}
function borraEj(rid, i){
  const r = rutina(rid);
  if(!confirm('¿Eliminar "'+r.exercises[i].name+'" de esta rutina?')) return;
  delete DB.imgs[r.exercises[i].id];
  r.exercises.splice(i,1); guardar(); pintaEditor(rid); toast('Ejercicio eliminado');
}

/* ----- alta y edición de ejercicio ----- */

function editaEj(rid, i){ abrirFormEj(rid, i, null); }

      <button class="${tipo==='weight'?'on':''}" data-t="weight" onclick="pickTipo(this)">⚖️ Peso + reps</button>

    </div>

      <div class="fg"><label class="lb">Objetivo</label><input id="eR" value="${e?esc(e.reps):'12-15 reps'}" placeholder="12-15 reps · 45 segundos"></div>
    </div>
    <div class="fg"><label class="lb">Cómo se hace</label><textarea id="eD" rows="4" placeholder="Explica la técnica: postura, recorrido, respiración, errores típicos…">${e?esc(e.desc||''):''}</textarea></div>
    <label class="lb">Imagen</label>
    <div class="imgprev" id="imgPrev">${prev?`<img src="${prev}">`:'🏋️'}</div>
    <div class="row" style="gap:8px;margin-bottom:6px">
      <button class="btn sec grow sm" onclick="document.getElementById('eImgFile').click()">Subir foto</button>

function quitaImg(){ imgTmp = 'NONE'; document.getElementById('imgPrev').innerHTML = '🏋️'; }

function cargaImg(ev){
  const file = ev.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 640;
      let w = im.width, h = im.height;
      if(w > max || h > max){ const k = Math.min(max/w, max/h); w = Math.round(w*k); h = Math.round(h*k); }
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const cx = cv.getContext('2d');
      cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);
      cx.drawImage(im, 0, 0, w, h);
      imgTmp = cv.toDataURL('image/jpeg', 0.72);
      document.getElementById('imgPrev').innerHTML = `<img src="${imgTmp}">`;
      const kb = Math.round(imgTmp.length*0.75/1024);
      toast('Imagen lista · '+kb+' KB');
    };
    im.onerror = () => alert('No he podido leer esa imagen.');
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

function guardaEj(){
  const {rid, i} = ejEdit;
  const r = rutina(rid);
  const name = document.getElementById('eN').value.trim();
  if(!name){ alert('Ponle nombre al ejercicio.'); return; }
  const datos = {
    name,
    phase: document.getElementById('eF').value,
    sets: Math.max(1, parseInt(document.getElementById('eS').value) || 1),
    reps: document.getElementById('eR').value.trim() || '12 reps',
    desc: document.getElementById('eD').value.trim(),
    type: tipoSel
  };
  let ex;
  if(i == null){
    ex = Object.assign({ id:'ex_'+Date.now(), emoji:'🏋️', img:'' }, datos);
    /* lo coloca al final de su fase */
    const ultimo = r.exercises.map((x,j)=>x.phase===datos.phase?j:-1).filter(j=>j>=0).pop();
    if(ultimo == null) r.exercises.push(ex); else r.exercises.splice(ultimo+1, 0, ex);
  } else {
    ex = Object.assign(r.exercises[i], datos);
  }
  if(imgTmp === 'NONE'){ delete DB.imgs[ex.id]; ex.img = ''; }
  else if(imgTmp){ DB.imgs[ex.id] = imgTmp; }
  const ok = guardar();
  if(!ok && imgTmp && imgTmp !== 'NONE'){
    delete DB.imgs[ex.id]; guardar();

function adher(s){ return Math.round(Object.values(s.chk).filter(Boolean).length / (7*TAREAS.length) * 100); }
function entrenosSem(k){
  return DB.sessions.filter(x => semKey(new Date(x.date)) === k).length;
}
function sparkline(vals){
  if(vals.length < 2) return '';
  const w=100,h=80,p=8, min=Math.min(...vals), max=Math.max(...vals), r=(max-min)||1;
  const pts = vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1), h-p-((v-min)/r)*(h-2*p)]);
  const d = pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="#6c3fc5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.4" fill="#6c3fc5"/>`).join('')}</svg>`;
}
/* ---- rachas y estadísticas ---- */
function semanaAtras(n){ const d = new Date(); d.setDate(d.getDate() - n*7); return semKey(d); }
function rachaSemanas(){
  let n = 0;
  for(let i = 0; i < 104; i++){
    const k = semanaAtras(i);
    const hay = DB.sessions.some(s => semKey(new Date(s.date)) === k);
    if(hay) n++;
    else if(i > 0) break;              // la semana en curso puede estar aún vacía
    else if(i === 0) continue;
  }
  return n;
}
function rachaDias(){
  let n = 0;
  for(let i = 0; i < 90; i++){
    const d = new Date(); d.setDate(d.getDate() - i);
    const s = DB.nutri.semanas[semKey(d)];
    if(!s){ break; }
    const di = (d.getDay()+6)%7;
    const hechas = Object.keys(s.chk).filter(k => k.startsWith('c_'+di+'_') && s.chk[k]).length;
    if(hechas >= 4) n++;
    else if(i === 0) continue;        // hoy todavía cuenta a medias
    else break;
  }
  return n;
}
function statsMes(){
  const ahora = new Date(), m = ahora.getMonth(), a = ahora.getFullYear();
  const ss = DB.sessions.filter(s => { const d = new Date(s.date); return d.getMonth() === m && d.getFullYear() === a; });
  const min = ss.reduce((x,s) => x + (s.duration||0), 0);
  const ser = ss.reduce((x,s) => x + (s.series||0), 0);
  return { n:ss.length, min, ser, media: ss.length ? Math.round(min/ss.length) : 0 };
}
function barrasSemanas(n){
  const datos = [];
  for(let i = n-1; i >= 0; i--){
    const k = semanaAtras(i);
    datos.push({ k, v: DB.sessions.filter(s => semKey(new Date(s.date)) === k).length, lbl: k.split('-S')[1] });
  }
  const max = Math.max(1, ...datos.map(d => d.v));
  return `<div class="chart">${datos.map(d => `<div class="cb ${d.v?'hot':''}" style="height:${Math.max(3, d.v/max*100)}%">
      ${d.v?`<span>${d.v}</span>`:''}</div>`).join('')}</div>
    <div class="chlabels">${datos.map(d=>`<div>${d.lbl}</div>`).join('')}</div>`;
}

function records(){
  const out = [];
  DB.routines.forEach(r => r.exercises.forEach(e => {
    const w = DB.weights[e.id]; if(!w || !w.length) return;
    const kgs = w.map(x=>x.kg).filter(x=>x!=null);
    out.push({ nombre:e.name, rutina:r.name, color:r.color, n:w.length,
      best: kgs.length ? Math.max(...kgs)+' kg' : (w[w.length-1].time || (w[w.length-1].reps+' rep')) });
  }));
  return out;
}

function addMedida(){
  const f = document.getElementById('mF').value;
  const p = parseFloat(document.getElementById('mP').value);
  const c = parseFloat(document.getElementById('mC').value);
  if(!f || (isNaN(p) && isNaN(c))){ alert('Pon al menos el peso o la cintura.'); return; }
  DB.nutri.medidas = DB.nutri.medidas.filter(m => m.f !== f);
  DB.nutri.medidas.push({ f, p: isNaN(p)?null:p, c: isNaN(c)?null:c });
  guardar(); pintaProgreso(); toast('Medida guardada');
}
function delMedida(f){ DB.nutri.medidas = DB.nutri.medidas.filter(m => m.f !== f); guardar(); pintaProgreso(); }
function exportar(){
  const b = new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'mi-plan-copia-'+iso(hoy())+'.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('Copia descargada');
}
function importar(ev){
  const file = ev.target.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => { try{
      const n = JSON.parse(rd.result);
      if(!n || !n.routines) throw 0;
      DB = Object.assign(nuevoDB(), n); guardar(); openView('progreso'); toast('Copia restaurada');
    }catch(e){ alert('Ese archivo no parece una copia válida de esta app.'); } };
  rd.readAsText(file);
}
